# Keep the shared ref pinned to a reviewed full commit SHA.
name: Weekly secret scan

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan all branches and history
    uses: QuantStrategyLab/.github/.github/workflows/gitleaks.yml@d3fa195b9bbed6d6c34eb54a915b6330ececfca3
    with:
      full-history: true
