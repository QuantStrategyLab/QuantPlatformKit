name: Weekly secret scan

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan all branches and history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan full history and report paths and rule names only
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/secret-scan.json"
          result=0
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --redact --no-banner \
            --log-opts="--all --full-history" --report-format=json --report-path="$report" \
            > "$RUNNER_TEMP/secret-scan-cli.log" 2>&1 || result=$?
          if [[ "$result" != 0 && "$result" != 1 ]]; then
            echo "Secret scan could not complete; exit code $result" >&2
            exit "$result"
          fi
          python - "$report" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          findings = json.loads(Path(sys.argv[1]).read_text())
          lines = sorted({f"{item['File']} | {item['RuleID']}" for item in findings})
          summary = "\n".join(lines) if lines else "No secret findings."
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("```text\n" + summary + "\n```\n")
          PY
          exit "$result"
