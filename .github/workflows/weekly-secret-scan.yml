    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan all branches and history
    uses: QuantStrategyLab/.github/.github/workflows/gitleaks.yml@5d644f07ca0133d3ba09c7e07e107e473fadcc9e
    with:
      full-history: true
