# Keep the shared ref pinned to a reviewed full commit SHA.
name: Weekly secret scan

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan all branches and history
    uses: QuantStrategyLab/.github/.github/workflows/gitleaks.yml@1de428f00aeef77ba939edfd3420b202c7166953
    with:
      full-history: true
