name: Trigger Downstream CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "QPK_PIN"
      - "constraints.txt"

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 5
      matrix:
        repo:
          - QuantStrategyLab/InteractiveBrokersPlatform
          - QuantStrategyLab/LongBridgePlatform
          - QuantStrategyLab/CharlesSchwabPlatform
          - QuantStrategyLab/FirstradePlatform
          - QuantStrategyLab/UsEquityStrategies
          - QuantStrategyLab/HkEquityStrategies
          - QuantStrategyLab/CnEquityStrategies
          - QuantStrategyLab/CryptoStrategies
          - QuantStrategyLab/UsEquitySnapshotPipelines
    steps:
      - name: Trigger ${{ matrix.repo }} CI
        run: |
          gh workflow run ci.yml --repo "${{ matrix.repo }}" --ref main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
