name: Fetch Alpaca public market data

# Manual, read-only collection of public market data. Needs the repository
# Actions secrets ALPACA_API_KEY_ID and ALPACA_API_SECRET_KEY. It issues GET
# requests to data.alpaca.markets only and has no trading, write or deploy path.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetch-alpaca-public-market-data
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch raw responses
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Mask credentials
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ALPACA_API_KEY_ID" ] || [ -z "$ALPACA_API_SECRET_KEY" ]; then
            echo "::error::Repository secrets ALPACA_API_KEY_ID and ALPACA_API_SECRET_KEY must both be set"
            exit 1
          fi
          echo "::add-mask::$ALPACA_API_KEY_ID"
          echo "::add-mask::$ALPACA_API_SECRET_KEY"

      - name: Fetch queries from the checked-in config
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/fetch_alpaca_public_market_data.py --out-dir "$RUNNER_TEMP/alpaca-public-market-data"

      - name: Verify checksums
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/alpaca-public-market-data"
          sha256sum --check --strict SHA256SUMS

      - name: Upload raw responses
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alpaca-public-market-data-${{ github.run_id }}
          path: ${{ runner.temp }}/alpaca-public-market-data
          retention-days: 7
          if-no-files-found: error
