name: Advance Staged QPK Pin

"on":
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      disable_legacy_pat_fallback:
        description: "Fail closed if App token minting fails instead of falling back to PAT/GITHUB_TOKEN"
        type: boolean
        required: false
        default: false
      verify_app_token_only:
        description: "Verify minted App token with read-only API calls and skip PR/merge-queue writes"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  advance:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'auto/qpk-pin-update') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QSL_GITHUB_APP_ID: ${{ secrets.QSL_GITHUB_APP_ID }}
      QSL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.QSL_GITHUB_APP_PRIVATE_KEY }}
      QSL_GITHUB_APP_PRIVATE_KEY_SECONDARY: ${{ secrets.QSL_GITHUB_APP_PRIVATE_KEY_SECONDARY }}
    steps:
      - name: Resolve the completed staged pin PR
        id: pr
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.verify_app_token_only) }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          COMPLETED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          pr_payload=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$COMPLETED_HEAD_BRANCH" \
            --json number,headRefOid \
            --jq '.[0] // {}')
          pr_number=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("number", ""))' <<<"$pr_payload")
          pr_head_sha=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("headRefOid", ""))' <<<"$pr_payload")

          if [ -z "$pr_number" ]; then
            echo "No open staged QPK pin PR found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$pr_head_sha" != "$COMPLETED_HEAD_SHA" ]; then
            echo "Skipping stale CI result for PR #$pr_number." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$pr_head_sha" >> "$GITHUB_OUTPUT"

      - name: Mint App token (primary)
        id: app_token_primary
        continue-on-error: true
        if: >-
          ((github.event_name == 'workflow_dispatch' && inputs.verify_app_token_only) ||
           steps.pr.outputs.number != '') &&
          env.QSL_GITHUB_APP_ID != '' &&
          env.QSL_GITHUB_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ env.QSL_GITHUB_APP_ID }}
          private-key: ${{ env.QSL_GITHUB_APP_PRIVATE_KEY }}
          owner: QuantStrategyLab
          repositories: QuantPlatformKit

      - name: Mint App token (secondary)
        id: app_token_secondary
        continue-on-error: true
        if: >-
          ((github.event_name == 'workflow_dispatch' && inputs.verify_app_token_only) ||
           steps.pr.outputs.number != '') &&
          env.QSL_GITHUB_APP_ID != '' &&
          env.QSL_GITHUB_APP_PRIVATE_KEY_SECONDARY != '' &&
          steps.app_token_primary.outcome != 'success'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ env.QSL_GITHUB_APP_ID }}
          private-key: ${{ env.QSL_GITHUB_APP_PRIVATE_KEY_SECONDARY }}
          owner: QuantStrategyLab
          repositories: QuantPlatformKit

      - name: Enforce App token (fail closed)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.disable_legacy_pat_fallback &&
          (inputs.verify_app_token_only || steps.pr.outputs.number != '')
        env:
          APP_TOKEN: ${{ steps.app_token_primary.outputs.token || steps.app_token_secondary.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "$APP_TOKEN" ]; then
            echo "::error title=App token required::app_token_mint_failed"
            exit 1
          fi
          echo "app_token_minted=true"

      - name: Verify App token only (read-only)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_app_token_only
        env:
          GH_TOKEN: ${{ steps.app_token_primary.outputs.token || steps.app_token_secondary.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=App token verification::app_token_missing"
            exit 1
          fi
          gh api repos/QuantStrategyLab/QuantPlatformKit --jq .full_name
          gh pr list -R QuantStrategyLab/QuantPlatformKit --limit 1

      - name: Enforce the staged-pin trust boundary
        id: guard
        if: steps.pr.outputs.number != '' && !(github.event_name == 'workflow_dispatch' && inputs.verify_app_token_only)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          APP_SLUG: ${{ steps.app_token_primary.outputs.app-slug || steps.app_token_secondary.outputs.app-slug }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json author,baseRefName,changedFiles,headRefName,isCrossRepository,isDraft,title,url > pr.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          pr = json.loads(Path("pr.json").read_text(encoding="utf-8"))
          author_login = (pr.get("author") or {}).get("login")
          app_slug = os.environ.get("APP_SLUG", "").strip()
          allowed_authors = {"Pigbibi"}
          if app_slug:
              allowed_authors.add(f"{app_slug}[bot]")
              allowed_authors.add(f"app/{app_slug}")
          allowed = (
              author_login in allowed_authors
              and pr.get("baseRefName") == "main"
              and pr.get("headRefName") == "auto/qpk-pin-update"
              and pr.get("title") == "chore: advance staged QPK pin"
              and pr.get("changedFiles") == 1
              and not pr.get("isCrossRepository")
              and not pr.get("isDraft")
          )
          reason = "ready" if allowed else "unexpected_pr_metadata"
          summary = [
              "## Staged QPK Pin Gate",
              f"- PR: {pr.get('url', '<unknown>')}",
              f"- Author: `{(pr.get('author') or {}).get('login', '<unknown>')}`",
              f"- Changed files: `{pr.get('changedFiles', '<unknown>')}`",
              f"- Cross-repository: `{'yes' if pr.get('isCrossRepository') else 'no'}`",
              f"- Decision: `{'advance' if allowed else 'skip'}`",
              f"- Reason: `{reason}`",
          ]
          Path("staged-pin-summary.md").write_text("\n".join(summary) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"allowed={'true' if allowed else 'false'}", file=output)
          PY

          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if [ "$files" != "QPK_PIN" ]; then
            echo "::error title=Staged QPK pin gate::unexpected_changed_files"
            exit 1
          fi

          candidate=$(gh api "repos/$GITHUB_REPOSITORY/contents/QPK_PIN?ref=$PR_HEAD_SHA" --jq '.content' \
            | base64 --decode | tr -d '\r\n')
          if ! [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Staged QPK pin gate::invalid_qpk_pin"
            exit 1
          fi

          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$candidate...$main_sha" --jq '.status')
          if [ "$comparison" != "ahead" ] && [ "$comparison" != "identical" ]; then
            echo "::error title=Staged QPK pin gate::candidate_is_not_on_main_history"
            exit 1
          fi

      - name: Append gate summary
        if: steps.pr.outputs.number != '' && !(github.event_name == 'workflow_dispatch' && inputs.verify_app_token_only)
        run: cat staged-pin-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh or queue validated staged pin
        if: steps.guard.outputs.allowed == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.verify_app_token_only)
        env:
          GH_TOKEN: ${{ steps.app_token_primary.outputs.token || steps.app_token_secondary.outputs.token || secrets.QSL_REPO_SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          merge_state=$(gh pr view "${{ steps.pr.outputs.number }}" \
            --repo "$GITHUB_REPOSITORY" --json mergeStateStatus --jq '.mergeStateStatus')
          if [ "$merge_state" = "BEHIND" ]; then
            gh api --method PUT \
              "repos/$GITHUB_REPOSITORY/pulls/${{ steps.pr.outputs.number }}/update-branch" \
              -f expected_head_sha="${{ steps.pr.outputs.head_sha }}" >/dev/null
            echo "Validated staged pin branch was behind main; requested branch update before merge." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$merge_state" != "CLEAN" ]; then
            echo "Staged QPK pin is not mergeable yet: $merge_state." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --auto --rebase --delete-branch \
            --match-head-commit "${{ steps.pr.outputs.head_sha }}"
