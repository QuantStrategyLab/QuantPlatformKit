name: Nightly Risk Mutation Tests

on:
  schedule:
    - cron: '29 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    name: Mutate risk & position sizing core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies and mutmut
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest mutmut==2.5.1 "jsonschema>=4.18,<5" "rfc3339-validator>=0.1.4,<1"

      - name: Run scoped mutation tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_position_sizing.py tests/test_promotion_sizing_chain.py
          set +e
          mutmut run \
            --paths-to-mutate=src/quant_platform_kit/position_sizing.py,src/quant_platform_kit/risk/promotion_sizing.py \
            --runner="python -m pytest -q tests/test_position_sizing.py tests/test_promotion_sizing_chain.py"
          mutmut_rc=$?
          set -e
          mutmut results >> "$GITHUB_STEP_SUMMARY"
          # mutmut 2.5 exits non-zero only on survived mutants after baseline tests pass
          echo "mutmut_exit=$mutmut_rc" >> "$GITHUB_STEP_SUMMARY"
