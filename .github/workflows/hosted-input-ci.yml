name: Hosted input staging CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Execute staging code with offline synthetic inputs only
        run: python scripts/check_hosted_input_bundle.py
