name: Update QPK Pin

on:
  workflow_dispatch:
    inputs:
      disable_legacy_pat_fallback:
        description: "Fail closed if App token minting fails instead of falling back to PAT/GITHUB_TOKEN"
        type: boolean
        required: false
        default: false
      verify_app_token_only:
        description: "Verify minted App token with read-only API calls and skip QPK_PIN/PR writes"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    env:
      QSL_GITHUB_APP_ID: ${{ secrets.QSL_GITHUB_APP_ID }}
      QSL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.QSL_GITHUB_APP_PRIVATE_KEY }}
      QSL_GITHUB_APP_PRIVATE_KEY_SECONDARY: ${{ secrets.QSL_GITHUB_APP_PRIVATE_KEY_SECONDARY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.1.0
        with:
          python-version: "3.11"

      - name: Update QPK_PIN
        id: update
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.verify_app_token_only) }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "$SHA" > QPK_PIN

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify QPK candidate
        id: verify
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          resolver_env="$(mktemp -d)"
          resolver_log="$(mktemp)"
          cleanup() {
            rm -rf -- "$resolver_env"
            rm -f -- "$resolver_log"
          }
          trap cleanup EXIT

          if ! python -m venv "$resolver_env" >"$resolver_log" 2>&1; then
            echo "::error title=QPK pin validation::aggregate_dependency_bootstrap_failed"
            exit 1
          fi
          resolver_python="$resolver_env/bin/python"
          qpk_sha=$(tr -d '[:space:]' < QPK_PIN)
          qpk_requirement="quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@${qpk_sha}"
          if ! "$resolver_python" -m pip install "$qpk_requirement" >"$resolver_log" 2>&1; then
            echo "::error title=QPK pin validation::qpk_candidate_install_failed"
            exit 1
          fi
          if ! "$resolver_python" -m pip check >"$resolver_log" 2>&1; then
            echo "::error title=QPK pin validation::aggregate_dependency_check_failed"
            exit 1
          fi
          echo "qpk_candidate_install_passed"

      - name: Mint App token (primary)
        id: app_token_primary
        continue-on-error: true
        if: >-
          ((github.event_name == 'workflow_dispatch' && inputs.verify_app_token_only) ||
           (steps.update.outputs.changed == 'true' && steps.verify.outcome == 'success')) &&
          env.QSL_GITHUB_APP_ID != '' &&
          env.QSL_GITHUB_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ env.QSL_GITHUB_APP_ID }}
          private-key: ${{ env.QSL_GITHUB_APP_PRIVATE_KEY }}
          owner: QuantStrategyLab
          repositories: QuantPlatformKit

      - name: Mint App token (secondary)
        id: app_token_secondary
        continue-on-error: true
        if: >-
          ((github.event_name == 'workflow_dispatch' && inputs.verify_app_token_only) ||
           (steps.update.outputs.changed == 'true' && steps.verify.outcome == 'success')) &&
          env.QSL_GITHUB_APP_ID != '' &&
          env.QSL_GITHUB_APP_PRIVATE_KEY_SECONDARY != '' &&
          steps.app_token_primary.outcome != 'success'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ env.QSL_GITHUB_APP_ID }}
          private-key: ${{ env.QSL_GITHUB_APP_PRIVATE_KEY_SECONDARY }}
          owner: QuantStrategyLab
          repositories: QuantPlatformKit

      - name: Enforce App token (fail closed)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.disable_legacy_pat_fallback &&
          (inputs.verify_app_token_only ||
           (steps.update.outputs.changed == 'true' && steps.verify.outcome == 'success'))
        env:
          APP_TOKEN: ${{ steps.app_token_primary.outputs.token || steps.app_token_secondary.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "$APP_TOKEN" ]; then
            echo "::error title=App token required::app_token_mint_failed"
            exit 1
          fi
          echo "app_token_minted=true"

      - name: Verify App token only (read-only)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_app_token_only
        env:
          GH_TOKEN: ${{ steps.app_token_primary.outputs.token || steps.app_token_secondary.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=App token verification::app_token_missing"
            exit 1
          fi
          gh api repos/QuantStrategyLab/QuantPlatformKit --jq .full_name
          gh pr list -R QuantStrategyLab/QuantPlatformKit --limit 1

      - name: Create PR for pin update
        id: create_pin_pr
        if: steps.update.outputs.changed == 'true' && steps.verify.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.verify_app_token_only)
        continue-on-error: true
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.8
        with:
          token: ${{ steps.app_token_primary.outputs.token || steps.app_token_secondary.outputs.token || secrets.QSL_REPO_SYNC_TOKEN || github.token }}
          commit-message: "chore: advance staged QPK pin"
          title: "chore: advance staged QPK pin"
          body: |
            Automated first stage of the QPK dependency rollout.

            The QPK candidate installation and `pip check` passed. Strategy pins and
            the aggregate bundle are advanced separately after their dependency
            closure is coherent.

            Updated SHA:
            - QPK: `${{ github.sha }}`

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          branch: auto/qpk-pin-update
          delete-branch: true
          base: main
          add-paths: |
            QPK_PIN

      - name: Report blocked pin PR creation
        if: steps.update.outputs.changed == 'true' && steps.create_pin_pr.outcome == 'failure' && !(github.event_name == 'workflow_dispatch' && inputs.verify_app_token_only)
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## QPK pin update PR not created

          The staged QPK pin update passed candidate verification, but PR creation failed.

          Ensure `QSL_REPO_SYNC_TOKEN` is configured as a **QuantPlatformKit repository secret**
          (see `docs/qpk-repo-sync-auth.zh-CN.md`). Org policy blocks `GITHUB_TOKEN` PR creation.
          MD
          echo "::warning::QPK pin update PR was not created because repository policy blocks GitHub Actions PR creation."
